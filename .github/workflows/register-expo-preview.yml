name: Register Expo preview deployment

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Active Expo EAS web deployment URL
        required: true
        type: string
        default: https://styleout--wiyoiyn3vl.expo.app/

permissions:
  contents: read
  deployments: write

jobs:
  register-deployment:
    name: Add preview to GitHub deployments
    runs-on: ubuntu-latest
    steps:
      - name: Register Expo preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = core.getInput('deployment_url', { required: true }).trim();
            let parsed;
            try {
              parsed = new URL(url);
            } catch {
              core.setFailed('Enter a valid Expo deployment URL.');
              return;
            }

            if (parsed.protocol !== 'https:' || !parsed.hostname.endsWith('.expo.app')) {
              core.setFailed('Deployment URL must use HTTPS and an expo.app hostname.');
              return;
            }

            const deployment = await github.rest.repos.createDeployment({
              ...context.repo,
              ref: context.sha,
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
              description: 'Expo EAS web preview',
              payload: { deployment_url: parsed.toString() },
            });

            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: parsed.toString(),
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Expo preview is live',
            });
